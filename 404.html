<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | kiran.codes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --accent: #00c9a7;
            --accent-dark: #00a88b;
            --bg: #0b0f19;
            --bg2: #0e1422;
            --bg3: #131929;
            --border: #1e2740;
            --text: #e8edf5;
            --muted: #6b7a99;
            --light: #9aaac4;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 24px;
            overflow: hidden;
            position: relative;
        }

        /* background glow */
        body::before {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0,201,167,0.05) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .nav-logo {
            position: absolute;
            top: 28px;
            left: 48px;
            font-family: 'Syne', sans-serif;
            font-size: 22px;
            font-weight: 800;
            color: var(--accent);
            text-decoration: none;
            letter-spacing: 1px;
        }

        .error-code {
            font-family: 'Syne', sans-serif;
            font-size: 140px;
            font-weight: 800;
            line-height: 1;
            color: var(--bg3);
            position: relative;
            z-index: 1;
            animation: fadeUp 0.6s ease forwards 0.2s;
            opacity: 0;
        }

        .error-code span {
            color: var(--accent);
        }

        .error-title {
            font-family: 'Syne', sans-serif;
            font-size: 28px;
            font-weight: 700;
            margin-top: 8px;
            opacity: 0;
            animation: fadeUp 0.6s ease forwards 0.4s;
        }

        .error-msg {
            color: var(--muted);
            font-size: 16px;
            font-weight: 300;
            max-width: 400px;
            margin-top: 12px;
            line-height: 1.8;
            opacity: 0;
            animation: fadeUp 0.6s ease forwards 0.6s;
        }

        .error-btns {
            display: flex;
            gap: 14px;
            margin-top: 36px;
            flex-wrap: wrap;
            justify-content: center;
            opacity: 0;
            animation: fadeUp 0.6s ease forwards 0.8s;
        }

        .btn-primary {
            padding: 13px 30px;
            background: var(--accent);
            color: #0b0f19;
            text-decoration: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            transition: background 0.3s ease, transform 0.2s ease;
            font-family: 'DM Sans', sans-serif;
        }

        .btn-primary:hover {
            background: var(--accent-dark);
            transform: translateY(-2px);
        }

        .btn-secondary {
            padding: 13px 30px;
            border: 1.5px solid var(--accent);
            color: var(--accent);
            text-decoration: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.3s ease;
            font-family: 'DM Sans', sans-serif;
        }

        .btn-secondary:hover {
            background: var(--accent);
            color: #0b0f19;
            transform: translateY(-2px);
        }

        .quick-links {
            display: flex;
            gap: 24px;
            margin-top: 40px;
            opacity: 0;
            animation: fadeUp 0.6s ease forwards 1s;
        }

        .quick-links a {
            color: var(--muted);
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s ease;
        }

        .quick-links a:hover { color: var(--accent); }

        /* floating dots decoration */
        .dot {
            position: absolute;
            border-radius: 50%;
            background: var(--accent);
            opacity: 0.15;
            animation: float 4s ease-in-out infinite;
        }

        .dot-1 { width: 8px; height: 8px; top: 20%; left: 15%; animation-delay: 0s; }
        .dot-2 { width: 5px; height: 5px; top: 70%; left: 10%; animation-delay: 1s; }
        .dot-3 { width: 10px; height: 10px; top: 30%; right: 12%; animation-delay: 0.5s; }
        .dot-4 { width: 6px; height: 6px; top: 75%; right: 18%; animation-delay: 1.5s; }
        .dot-5 { width: 4px; height: 4px; top: 50%; left: 5%; animation-delay: 2s; }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-16px); }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            .error-code { font-size: 100px; }
            .nav-logo { left: 24px; }
            .error-btns { flex-direction: column; align-items: center; }
        }
    </style>
</head>

</html>
