<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | kiran.codes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --accent: #00c9a7;
            --accent-dark: #00a88b;
            --bg: #0b0f19;
            --bg2: #0e1422;
            --bg3: #131929;
            --border: #1e2740;
            --text: #e8edf5;
            --muted: #6b7a99;
            --light: #9aaac4;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 24px;
            overflow: hidden;
            position: relative;
        }

        /* background glow */
        body::before {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0,201,167,0.05) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .nav-logo {
            position: absolute;
            top: 28px;
            left: 48px;
            font-family: 'Syne', sans-serif;
            font-size: 22px;
            font-weight: 800;
            color: var(--accent);
            text-decoration: none;
            letter-spacing: 1px;
        }

        .error-code {
            font-family: 'Syne', sans-serif;
            font-size: 140px;
            font-weight: 800;
            line-height: 1;
            color: var(--bg3);
            position: relative;
            z-index: 1;
            animation: fadeUp 0.6s ease forwards 0.2s;
            opacity: 0;
        }


</html>
